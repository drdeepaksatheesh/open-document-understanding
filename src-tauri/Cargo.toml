[package]
name = "open-document-understanding"
version = "0.1.0-alpha.4"
description = "Privacy-first local document understanding reader"
authors = ["Open Document Understanding contributors"]
edition = "2021"

[lib]
name = "open_document_understanding_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.8.0", features = [] }
tauri-plugin-dialog = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
