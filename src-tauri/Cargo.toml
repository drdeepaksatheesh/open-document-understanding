[package]
name = "open-document-understanding"
version = "0.1.0-alpha.1"
description = "Privacy-first local document understanding reader"
authors = ["Open Document Understanding contributors"]
edition = "2021"

[lib]
name = "open_document_understanding_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
